name: Build My Overlay APK

on:
  push:
    branches: [main, master]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.9"

      # รองรับ 2 แบบ: (1) ไฟล์โปรเจกต์อยู่ใน repo ตรง ๆ  (2) อัปโหลดเป็นไฟล์ .zip ไฟล์เดียวไว้ที่ root ของ repo
      - name: Locate project
        run: |
          ZIP=$(ls ./*.zip 2>/dev/null | head -n 1 || true)
          if [ -n "$ZIP" ]; then
            mkdir -p _p
            unzip -q -o "$ZIP" -d _p
            DIR=$(dirname "$(find _p -name settings.gradle.kts | head -n 1)")
          else
            DIR=.
          fi
          echo "Project dir: $DIR"
          echo "PROJECT_DIR=$DIR" >> "$GITHUB_ENV"

      - name: Install Android SDK platform
        run: |
          SDKM="$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager"
          yes | "$SDKM" --licenses > /dev/null || true
          "$SDKM" "platforms;android-34" "build-tools;34.0.0" > /dev/null || true

      - name: Build debug APK
        working-directory: ${{ env.PROJECT_DIR }}
        run: gradle assembleDebug --no-daemon --stacktrace

      - name: Collect APK
        run: |
          APK=$(find "$PROJECT_DIR" -name "app-debug.apk" | head -n 1)
          cp "$APK" MyOverlay.apk
          ls -la MyOverlay.apk

      - uses: actions/upload-artifact@v4
        with:
          name: MyOverlay-apk
          path: MyOverlay.apk

      # สร้างหน้า Release ที่โหลด APK ได้ตรง ๆ จากมือถือ
      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release delete latest --cleanup-tag -y || true
          gh release create latest MyOverlay.apk \
            --title "My Overlay (latest)" \
            --notes "My Overlay โดย kaew_kung" \
            --target "$GITHUB_SHA"
